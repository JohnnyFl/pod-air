# This workflow build and push a Docker container to Google Artifact Registry
# and deploy it on Cloud Run when a commit is pushed to the "main"
# branch.
#
# To configure this workflow:
#
# 1. Enable the following Google Cloud APIs:
#
#    - Artifact Registry (artifactregistry.googleapis.com)
#    - Cloud Run (run.googleapis.com)
#    - IAM Credentials API (iamcredentials.googleapis.com)
#
#    You can learn more about enabling APIs at
#    https://support.google.com/googleapi/answer/6158841.
#
# 2. Create and configure a Workload Identity Provider for GitHub:
#    https://github.com/google-github-actions/auth#preferred-direct-workload-identity-federation.
#
#    Depending on how you authenticate, you will need to grant an IAM principal
#    permissions on Google Cloud:
#
#    - Artifact Registry Administrator (roles/artifactregistry.admin)
#    - Cloud Run Developer (roles/run.developer)
#
#    You can learn more about setting IAM permissions at
#    https://cloud.google.com/iam/docs/manage-access-other-resources
#
# 3. Change the values in the "env" block to match your values.

name: "Build and Deploy to Cloud Run"
# TODO: Use matrix strategy to build and deploy multiple services later
on:
  push:
    branches:
      - "main"
    paths:
      # - "backend/internal/uploader/**"
      # - "backend/cmd/uploader/**"
      # - "!frontend/**"
  workflow_dispatch: # Allow manual triggering

env:
  PROJECT_ID: "pod-pilot" # TODO: update to your Google Cloud project ID
  REGION: "us-central1" # TODO: update to your region

jobs:
  deploy-uploader:
    runs-on: "ubuntu-latest"

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332" # actions/checkout@v4

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          # create_credentials_file: true
          # token_format: "access_token"
          project_id: "pod-pilot"
          workload_identity_provider: "projects/627664978786/locations/global/workloadIdentityPools/github/providers/my-repo"
          # workload_identity_provider: "projects/627664978786/locations/global/workloadIdentityPools/github/providers/github"
          # service_account: "pod-pilot-upload@pod-pilot.iam.gserviceaccount.com"

      # - name: "Verify Authentication"
      #   run: |
      #     gcloud auth list
      #     gcloud config list
      #     gcloud projects get-iam-policy pod-pilot --filter="bindings.members:pod-pilot-upload@pod-pilot.iam.gserviceaccount.com" --format="value(bindings.role)"
      # Set up gcloud CLI
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      # Configure Docker to use gcloud credentials
      - name: "Configure Docker for Artifact Registry"
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Create Artifact Registry repository if it doesn't exist
      - name: "Create Artifact Registry Repository"
        run: |
          gcloud artifacts repositories describe uploader \
            --location=${{ env.REGION }} || \
          gcloud artifacts repositories create uploader \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --description="Docker repository for uploader service"

      - name: "Docker Auth"
        uses: "docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567" # docker/login-action@v3
        with:
          username: "oauth2accesstoken"
          password: "${{ steps.auth.outputs.auth_token }}"
          registry: "${{ env.REGION }}-docker.pkg.dev"

      - name: "Build and Push Container"
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/uploader/uploader-image:${{ github.sha }}"
          docker build -f ./backend/internal/uploader/Dockerfile -t "${DOCKER_TAG}" ./backend
          docker push "${DOCKER_TAG}"

      - id: "deploy"
        name: "Deploy to Cloud Run"
        uses: "google-github-actions/deploy-cloudrun@33553064113a37d688aa6937bacbdc481580be17" # google-github-actions/deploy-cloudrun@v2
        with:
          service: "uploader"
          region: "${{ env.REGION }}"
          image: "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/uploader/uploader-image:${{ github.sha }}"
          timeout: "300s" # Increase timeout to 5 minutes
          flags: "--service-account=pod-pilot-upload@pod-pilot.iam.gserviceaccount.com"

      - name: "Show output"
        run: echo ${{ steps.deploy.outputs.url }}
